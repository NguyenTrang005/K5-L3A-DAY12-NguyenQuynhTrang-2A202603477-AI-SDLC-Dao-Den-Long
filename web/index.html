<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0E1430">
    <meta name="description" content="Cùng Mây gom đom đóm và thắp lại những ngọn đèn trên ba hòn đảo giữa biển mây.">
    <title>Đảo Đèn Lồng</title>
    <link rel="stylesheet" href="./web/style.css">
  </head>
  <body>
    <main id="game">
      <canvas id="scene" aria-label="Cảnh 3D"></canvas>
      <div id="hud" hidden>
        <header class="hud">
          <div class="meter lives"><small>Ngọn Lửa</small><strong id="flames"></strong><span id="location"></span></div>
          <div class="meter timer"><small>Đến bình minh</small><strong><span id="warning-mark" aria-hidden="true" hidden>⚠ </span><span id="time"></span></strong></div>
          <div class="meter objectives"><small>Đèn đang sáng</small><strong id="lanterns"></strong><span id="goal"></span><span>Điểm <b id="score"></b></span></div>
        </header>
        <div id="direction" class="direction" aria-label="Hướng tới đèn chưa sáng" hidden><span>▲</span></div>
        <div id="hint" class="hint" aria-live="polite"></div>
        <footer class="action-bar">
          <div class="controls folded"><span><kbd>W A S D</kbd> Đi</span><span><kbd>Space</kbd> Nhảy</span><span><kbd>← →</kbd> Camera</span><span><kbd>Esc</kbd> Dừng</span></div>
          <div class="meter inventory"><small>Đom đóm <b id="mote-count"></b></small><div id="motes"></div></div>
          <div class="meter cooldowns">
            <div><span class="icon" aria-hidden="true">➤</span><small><kbd>Shift</kbd> Lướt</small><b id="dash"></b></div>
            <div><span class="icon" aria-hidden="true">✧</span><small><kbd>F</kbd> Tỏa Sáng</small><b id="pulse"></b></div>
          </div>
        </footer>
      </div>
      <div id="overlay" class="overlay" data-mode="menu">
        <section class="panel" aria-labelledby="panel-title">
          <p id="panel-kicker" class="eyebrow">BA ĐÊM GIỮ LỬA</p>
          <h1 id="panel-title">Đảo Đèn Lồng</h1>
          <p id="panel-copy"></p>
          <div id="panel-settings" class="settings" hidden>
            <label for="volume">Âm lượng <output id="volume-value" for="volume"></output></label>
            <input id="volume" type="range" min="0" max="100" step="1">
            <label for="sensitivity">Độ nhạy chuột <output id="sensitivity-value" for="sensitivity"></output></label>
            <input id="sensitivity" type="range" min="25" max="175" step="5">
            <label class="toggle" for="accessibleColors">Bảng màu dễ phân biệt <input id="accessibleColors" type="checkbox"></label>
          </div>
          <div id="actions" class="buttons"></div>
        </section>
      </div>
    </main>
    <script type="module" src="./web/client.mjs"></script>
  </body>
</html>
